name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  node:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: ['ubuntu-latest', 'windows-latest']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '22'
      - name: Install dependencies
        run: if [ -f package-lock.json ]; then npm ci; elif [ -f package.json ]; then npm install; fi
      - name: Lint (if configured)
        run: if [ -f package.json ]; then npm run lint --if-present; fi
      - name: Typecheck (if configured)
        run: if [ -f package.json ]; then npm run typecheck --if-present; fi
      - name: Build (if configured)
        run: if [ -f package.json ]; then npm run build --if-present; fi
      - name: Run tests
        run: if [ -f package.json ]; then npm test --if-present; fi
