name: authormark
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af  # v4.1.0
        with:
          node-version: '20'

      # Presence check needs no secret. Full fingerprint verification runs only
      # when the HMAC key is available as a repo secret.
      - name: AuthorMark — presence check
        uses: Srinivasan-78/authormark-watch@a9ec3a6a6a1047eca6fd2bada07ec27643ed632e  # main
        with:
          mode: check-presence
          path: .

      - name: AuthorMark — fingerprint verify
        if: ${{ secrets.AUTHORMARK_KEY != '' }}
        uses: Srinivasan-78/authormark-watch@a9ec3a6a6a1047eca6fd2bada07ec27643ed632e  # main
        with:
          mode: check-presence
          path: .
          key: ${{ secrets.AUTHORMARK_KEY }}
