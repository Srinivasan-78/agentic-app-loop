name: AuthorMark

# Runs this repo through the AuthorMark engine maintained in
# Srinivasan-78/authormark-watch — the account-wide authorship-watermark
# supervisor. On push / PR it checks every source file still carries its
# @authormark v1 header. The scheduled account-wide watch in authormark-watch
# also picks this repo up automatically.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  authormark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: '20'

      # Presence check needs no secret. Full fingerprint verification runs only
      # when the HMAC key is available as a repo secret.
      - name: AuthorMark — presence check
        uses: Srinivasan-78/authormark-watch@a9ec3a6a6a1047eca6fd2bada07ec27643ed632e  # main
        with:
          mode: check-presence
          path: .

      - name: AuthorMark — fingerprint verify
        if: ${{ secrets.AUTHORMARK_KEY != '' }}
        uses: Srinivasan-78/authormark-watch@a9ec3a6a6a1047eca6fd2bada07ec27643ed632e  # main
        with:
          mode: check
          path: .
          key: ${{ secrets.AUTHORMARK_KEY }}
